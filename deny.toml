[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "Zlib"
]

[[licenses.clarify]]
name = "ring"
expression = "ISC AND OpenSSL AND MIT"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# See https://github.com/Rafostar/clapper/blob/master/README.md
[[licenses.clarify]]
name = "clapper"
expression = "LGPL-2.1-or-later"
license-files = []

# See https://github.com/Rafostar/clapper/blob/master/README.md
[[licenses.clarify]]
name = "clapper-gtk"
expression = "LGPL-2.1-or-later"
license-files = []

# See https://github.com/Rafostar/clapper/blob/master/README.md
[[licenses.clarify]]
name = "clapper-sys"
expression = "LGPL-2.1-or-later"
license-files = []

# See https://github.com/Rafostar/clapper/blob/master/README.md
[[licenses.clarify]]
name = "clapper-gtk-sys"
expression = "LGPL-2.1-or-later"
license-files = []

[bans]
multiple-versions = "allow"

[sources.allow-org]
gitlab = ["schmiddi-on-mobile"]

[advisories]
ignore = [
]
